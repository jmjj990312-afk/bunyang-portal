name: 청약 일정 자동 갱신
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 오전 6시(한국시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_cheongyak.py
        env:
          APPLYHOME_KEY: ${{ secrets.APPLYHOME_KEY }}
      - run: |
          git config user.name "cheongyak-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cheongyak.json
          git diff --cached --quiet || (git commit -m "청약 일정 갱신" && git push)
